name: Legiscope Weekly Pipeline

on:
  # 2026-09-07: 정기 실행 해제. GitHub 호스티드 러너(해외 IP)에서 open.assembly.go.kr / www.law.go.kr 접속이
  # 차단돼(ConnectTimeoutError) 7/13 이관 이후 수집 0건이었음. 정기 수집은 로컬 Windows 작업 스케줄러
  # LegiscopeWeekly(월 09:00)가 담당. 이 워크플로는 수동 점검용으로만 유지.
  # schedule:
  #   - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      LAW_OC: ${{ secrets.LAW_OC }}
      SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install slack-sdk

      - name: Run weekly pipeline
        run: python run_weekly.py

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-logs-${{ github.run_id }}
          path: output/logs/
          retention-days: 30
          if-no-files-found: warn
